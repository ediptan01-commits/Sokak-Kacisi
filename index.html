<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sokak Kaçışı</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    touch-action: none;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background:
        linear-gradient(
            #62c8ff 0%,
            #ccefff 40%,
            #555 40%,
            #222 100%
        );
}

/* YOL */
#road {
    position: absolute;
    width: 90%;
    height: 70%;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    background: #303030;

    clip-path: polygon(
        25% 0,
        75% 0,
        100% 100%,
        0 100%
    );
}

/* ŞERİT ÇİZGİLERİ */
.lane-line {
    position: absolute;
    top: 0;
    width: 5px;
    height: 100%;

    background: repeating-linear-gradient(
        to bottom,
        white 0px,
        white 50px,
        transparent 50px,
        transparent 100px
    );

    opacity: .7;
}

#line1 {
    left: 38%;
}

#line2 {
    left: 62%;
}

/* OYUNCU */
#player {
    position: absolute;
    width: 55px;
    height: 75px;

    bottom: 65px;
    left: 50%;

    transform: translateX(-50%);

    background: #ff3b30;

    border: 4px solid white;

    border-radius: 15px;

    z-index: 10;
}

#player::before {
    content: "";

    position: absolute;

    width: 32px;
    height: 32px;

    left: 7px;
    top: -27px;

    background: #ffd1a9;

    border: 3px solid white;

    border-radius: 50%;
}

/* ENGEL */
.obstacle {
    position: absolute;

    width: 58px;
    height: 58px;

    background: #ff9500;

    border: 4px solid white;

    border-radius: 8px;

    z-index: 8;
}

/* PARA */
.coin {
    position: absolute;

    width: 32px;
    height: 32px;

    border-radius: 50%;

    background: radial-gradient(
        circle,
        #fff36b 0%,
        #ffd60a 45%,
        #ff9500 100%
    );

    border: 3px solid #fff;

    box-shadow:
        0 0 10px #ffd60a;

    z-index: 9;

    animation: coinSpin .5s linear infinite;
}

@keyframes coinSpin {

    0% {
        transform: rotateY(0deg);
    }

    50% {
        transform: rotateY(90deg);
    }

    100% {
        transform: rotateY(180deg);
    }

}

/* BİLGİ */
#score,
#coins {
    position: absolute;

    color: white;

    font-size: 22px;

    font-weight: bold;

    text-shadow: 2px 2px 4px black;

    z-index: 30;
}

#score {
    top: 18px;
    left: 18px;
}

#coins {
    top: 52px;
    left: 18px;
}

#title {
    position: absolute;

    top: 18px;
    right: 18px;

    color: white;

    font-weight: bold;

    text-shadow: 2px 2px 4px black;

    z-index: 30;
}

/* BAŞLANGIÇ */
#startScreen,
#gameOver {
    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background: rgba(0,0,0,.7);

    color: white;

    z-index: 100;

    text-align: center;
}

#gameOver {
    display: none;
}

h1,
h2 {
    font-size: 42px;
    margin-bottom: 15px;
}

p {
    margin-bottom: 25px;
}

button {
    border: none;

    color: white;

    padding: 15px 40px;

    border-radius: 30px;

    font-size: 21px;

    font-weight: bold;
}

#startButton {
    background: #ff3b30;
}

#restartButton {
    background: #34c759;

    margin-top: 20px;
}

#finalCoins {
    margin-top: 8px;
}
</style>
</head>

<body>

<div id="game">

    <div id="score">
        Puan: 0
    </div>

    <div id="coins">
        Altın: 0
    </div>

    <div id="title">
        SOKAK KAÇIŞI
    </div>

    <div id="road">

        <div
            class="lane-line"
            id="line1">
        </div>

        <div
            class="lane-line"
            id="line2">
        </div>

    </div>

    <div id="player"></div>

    <div id="startScreen">

        <h1>
            SOKAK KAÇIŞI
        </h1>

        <p>
            Engellerden kaç, altınları topla!
        </p>

        <button id="startButton">
            BAŞLA
        </button>

    </div>

    <div id="gameOver">

        <h2>
            OYUN BİTTİ
        </h2>

        <div id="finalScore">
            Puan: 0
        </div>

        <div id="finalCoins">
            Altın: 0
        </div>

        <button id="restartButton">
            TEKRAR OYNA
        </button>

    </div>

</div>

<script>

let playing = false;

let score = 0;

let coins = 0;

let playerLane = 1;

let obstacles = [];

let coinObjects = [];

let obstacleTimer = 0;

let coinTimer = 0;

let speed = 5;

let lastTime = 0;


/* HTML */

const player =
    document.getElementById("player");

const scoreText =
    document.getElementById("score");

const coinsText =
    document.getElementById("coins");

const startScreen =
    document.getElementById("startScreen");

const gameOver =
    document.getElementById("gameOver");

const finalScore =
    document.getElementById("finalScore");

const finalCoins =
    document.getElementById("finalCoins");


/* ŞERİTLER */

const lanes = [
    "30%",
    "50%",
    "70%"
];


/* OYUNCU */

function updatePlayer() {

    player.style.left =
        lanes[playerLane];

}


/* OYUNU BAŞLAT */

function startGame() {

    playing = true;

    score = 0;

    coins = 0;

    playerLane = 1;

    speed = 5;

    obstacleTimer = 0;

    coinTimer = 0;

    obstacles.forEach(
        o => o.element.remove()
    );

    coinObjects.forEach(
        c => c.element.remove()
    );

    obstacles = [];

    coinObjects = [];

    updatePlayer();

    scoreText.textContent =
        "Puan: 0";

    coinsText.textContent =
        "Altın: 0";

    startScreen.style.display =
        "none";

    gameOver.style.display =
        "none";

    lastTime =
        performance.now();

    requestAnimationFrame(gameLoop);

}


/* ENGEL OLUŞTUR */

function createObstacle() {

    const obstacle =
        document.createElement("div");

    obstacle.className =
        "obstacle";

    const lane =
        Math.floor(Math.random() * 3);

    obstacle.style.left =
        lanes[lane];

    obstacle.style.top =
        "-80px";

    document
        .getElementById("game")
        .appendChild(obstacle);

    obstacles.push({

        element: obstacle,

        lane: lane,

        y: -80

    });

}


/* PARA OLUŞTUR */

function createCoin() {

    const coin =
        document.createElement("div");

    coin.className =
        "coin";

    const lane =
        Math.floor(Math.random() * 3);

    coin.style.left =
        lanes[lane];

    coin.style.top =
        "-50px";

    document
        .getElementById("game")
        .appendChild(coin);

    coinObjects.push({

        element: coin,

        lane: lane,

        y: -50

    });

}


/* ÇARPIŞMA */

function isColliding(element1, element2) {

    const rect1 =
        element1.getBoundingClientRect();

    const rect2 =
        element2.getBoundingClientRect();

    return !(
        rect1.right < rect2.left ||
        rect1.left > rect2.right ||
        rect1.bottom < rect2.top ||
        rect1.top > rect2.bottom
    );

}


/* OYUN DÖNGÜSÜ */

function gameLoop(time) {

    if (!playing) return;

    const delta =
        time - lastTime;

    lastTime = time;

    obstacleTimer += delta;

    coinTimer += delta;


    /* ENGEL */

    if (obstacleTimer > 950) {

        createObstacle();

        obstacleTimer = 0;

    }


    /* PARA */

    if (coinTimer > 650) {

        createCoin();

        coinTimer = 0;

    }


    /* ENGELLER */

    obstacles.forEach(obstacle => {

        obstacle.y += speed;

        obstacle.element.style.top =
            obstacle.y + "px";


        if (
            obstacle.lane === playerLane &&
            isColliding(
                player,
                obstacle.element
            )
        ) {

            endGame();

        }

    });


    /* PARALAR */

    coinObjects.forEach(coin => {

        coin.y += speed;

        coin.element.style.top =
            coin.y + "px";


        if (
            coin.lane === playerLane &&
            isColliding(
                player,
                coin.element
            )
        ) {

            coins++;

            coinsText.textContent =
                "Altın: " + coins;

            coin.element.remove();

            coin.collected = true;

        }

    });


    /* EKRANDAN ÇIKAN ENGELLER */

    obstacles =
        obstacles.filter(obstacle => {

            if (
                obstacle.y >
                window.innerHeight + 100
            ) {

                obstacle.element.remove();

                return false;

            }

            return true;

        });


    /* EKRANDAN ÇIKAN PARALAR */

    coinObjects =
        coinObjects.filter(coin => {

            if (
                coin.collected ||
                coin.y >
                window.innerHeight + 100
            ) {

                if (!coin.collected) {
                    coin.element.remove();
                }

                return false;

            }

            return true;

        });


    /* PUAN */

    score += delta / 100;

    scoreText.textContent =
        "Puan: " +
        Math.floor(score);


    /* HIZ */

    speed =
        5 + score / 250;


    requestAnimationFrame(gameLoop);

}


/* OYUN BİTTİ */

function endGame() {

    playing = false;

    finalScore.textContent =
        "Puan: " +
        Math.floor(score);

    finalCoins.textContent =
        "Altın: " +
        coins;

    gameOver.style.display =
        "flex";

}


/* KLAVYE */

document.addEventListener(
    "keydown",
    function(event) {

        if (!playing) return;

        if (
            event.key === "ArrowLeft"
        ) {

            if (playerLane > 0) {

                playerLane--;

                updatePlayer();

            }

        }


        if (
            event.key === "ArrowRight"
        ) {

            if (playerLane < 2) {

                playerLane++;

                updatePlayer();

            }

        }

    }
);


/* TELEFON KAYDIRMA */

let touchStartX = 0;

document.addEventListener(
    "touchstart",
    function(event) {

        touchStartX =
            event.touches[0].clientX;

    }
);


document.addEventListener(
    "touchend",
    function(event) {

        if (!playing) return;

        const touchEndX =
            event.changedTouches[0].clientX;

        const difference =
            touchEndX - touchStartX;


        if (
            Math.abs(difference) < 40
        ) return;


        if (difference < 0) {

            if (playerLane > 0) {

                playerLane--;

                updatePlayer();

            }

        } else {

            if (playerLane < 2) {

                playerLane++;

                updatePlayer();

            }

        }

    }
);


document.getElementById(
    "startButton"
).onclick = startGame;


document.getElementById(
    "restartButton"
).onclick = startGame;


updatePlayer();

</script>

</body>
</html>
